android.useAndroidX=true
# One JVM for the whole build: Kotlin compiles inside the Gradle daemon
# rather than in a second daemon with its own heap. With two, a small
# machine (a GitHub Codespace running VS Code's Java tools) ran out of
# memory on a release build and the system killed the daemon ("Gradle
# build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
kotlin.code.style=official
