android.useAndroidX=true
# One JVM for the whole build, kept small: Kotlin compiles inside the
# Gradle daemon rather than in a second daemon with its own heap, the heap
# is 2 GB (a release build's R8 needs well under that) and at most two
# tasks run at once. A GitHub Codespace on the 8 GB machine also runs VS
# Code and its Java tools; with more, the system ran out of memory on a
# release build and killed the daemon ("Gradle build daemon disappeared
# unexpectedly"). CI's release job builds with these same settings.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
kotlin.code.style=official
