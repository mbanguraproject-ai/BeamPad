name: Build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Writes the debug APK to the "debug-latest" release on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: beampad-debug
          path: app/build/outputs/apk/debug/*.apk

      # A plain .apk link for phones, replaced on every push to main:
      # https://github.com/<owner>/<repo>/releases/download/debug-latest/BeamPad-debug.apk
      - name: Publish debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BeamPad-debug.apk
          notes="Debug build of main at ${GITHUB_SHA::7}. Replaced on every push to main."
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "$notes"
          fi
          gh release upload debug-latest BeamPad-debug.apk --clobber
          gh release edit debug-latest --notes "$notes"

  # The Play build, APK and AAB in one go: R8 shrinking and lint's release
  # checks only run here, so a problem that would only show up when
  # publishing fails the push instead. Signed with the upload key when the
  # repository has it as secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
  # KEY_ALIAS, KEY_PASSWORD); unsigned otherwise. On main both files are
  # attached to the GitHub release for the version in app/build.gradle.kts.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key in the repository secrets: building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > beampad-release.jks
          {
            echo "storeFile=beampad-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect
        id: out
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          suffix=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "-unsigned")
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/BeamPad-$version$suffix.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/BeamPad-$version$suffix.aab"
          cp wear/build/outputs/apk/release/*.apk "dist/BeamPad-wear-$version$suffix.apk"
          cp wear/build/outputs/bundle/release/*.aab "dist/BeamPad-wear-$version$suffix.aab"
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: beampad-release-${{ steps.out.outputs.version }}
          path: dist/*

      - name: Publish to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.out.outputs.version }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          tag="v$VERSION"
          if [ "$SIGNED" = "true" ]; then
            notes="BeamPad $VERSION, signed with the upload key. Built from ${GITHUB_SHA::7}."
          else
            notes="BeamPad $VERSION, unsigned (no upload key in the repository secrets): sign before installing or uploading to Play. Built from ${GITHUB_SHA::7}."
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "BeamPad $VERSION" --notes "$notes"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --notes "$notes"

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes the rendered screens to the ci-shots branch for review.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "*ScreenshotTest*" :wear:testDebugUnitTest

      - name: Test report on failure
        if: failure()
        run: |
          find app/build/test-results wear/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; | while read f; do
            echo "=== $f"; sed -n '/<failure/,/<\/failure>/p' "$f" | head -60
          done

      - name: Publish to ci-shots
        if: always() && github.event_name == 'push'
        run: |
          [ -d app/build/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
          cp wear/build/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          echo "${GITHUB_SHA}" > SHA
          git init -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screens for ${GITHUB_SHA}"
          # main and a claude/* branch can carry the same commit, and both
          # runs publish here at once; the loser of that race tries again.
          for attempt in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots && exit 0
            sleep $((attempt * 5))
          done
          exit 1
