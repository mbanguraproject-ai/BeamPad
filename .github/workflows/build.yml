name: Build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Writes the debug APK to the "debug-latest" release on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: beampad-debug
          path: app/build/outputs/apk/debug/*.apk

      # A plain .apk link for phones, replaced on every push to main:
      # https://github.com/<owner>/<repo>/releases/download/debug-latest/BeamPad-debug.apk
      - name: Publish debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BeamPad-debug.apk
          notes="Debug build of main at ${GITHUB_SHA::7}. Replaced on every push to main."
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "$notes"
          fi
          gh release upload debug-latest BeamPad-debug.apk --clobber
          gh release edit debug-latest --notes "$notes"

  # The Play build: R8 shrinking and lint's release checks only run here,
  # so a problem that would only show up when publishing fails the push
  # instead. Unsigned in CI (no keystore); Play signing is unaffected.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release APK
        run: ./gradlew --no-daemon assembleRelease

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes the rendered screens to the ci-shots branch for review.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        run: ./gradlew --no-daemon testDebugUnitTest --tests "*ScreenshotTest*"

      - name: Test report on failure
        if: failure()
        run: |
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; | while read f; do
            echo "=== $f"; sed -n '/<failure/,/<\/failure>/p' "$f" | head -60
          done

      - name: Publish to ci-shots
        if: always() && github.event_name == 'push'
        run: |
          [ -d app/build/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          echo "${GITHUB_SHA}" > SHA
          git init -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screens for ${GITHUB_SHA}"
          # main and a claude/* branch can carry the same commit, and both
          # runs publish here at once; the loser of that race tries again.
          for attempt in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots && exit 0
            sleep $((attempt * 5))
          done
          exit 1
